name: docs-lint

on:
  push:
    paths:
      - "**.md"
      - "tools/**"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "**.md"
      - "tools/**"
      - ".github/workflows/docs-lint.yml"

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # npm プロジェクトで package.json に docs-lint を devDependency として
      # 追加している場合は、次の2行を使う:
      #   - run: npm ci
      #   - run: npx docs-lint
      # package.json を持たない/追加していない場合は、npx でパッケージを直接指定する:
      - run: npx --yes -p "github:128na/docs-lint#v1.0.0" docs-lint
